<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Clientes - ScoutPro</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header><a href="index.html">← Voltar</a></header>
  <main>
    <h2>Clientes</h2>
    <div id="status"></div>
    <ul id="clientes"></ul>
  </main>
  <script src="assets/app.js"></script>
  <script>
    async function load() {
      const status = document.getElementById('status');
      const ul = document.getElementById('clientes');
      try {
        const res = await apiFetch('/clientes');
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        ul.innerHTML = data.map(c => `<li>${c.nome} (id:${c.id}) — atletasMonitorados: ${c.atletasMonitorados ?? 0}</li>`).join('');
        status.textContent = 'OK';
      } catch (err) {
        status.textContent = 'Erro: ' + err;
      }
    }
    load();
  </script>
</body>
</html>

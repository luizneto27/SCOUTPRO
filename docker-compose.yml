services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: scoutpro-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scoutpro-project}
      POSTGRES_USER: ${POSTGRES_USER:-scoutpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scoutpro}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scoutpro} -d ${POSTGRES_DB:-scoutpro-project}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scoutpro-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-scoutpro-project}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-scoutpro}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-scoutpro}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:

name: Build and Push to ACR

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: acr-push-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: scoutpro-api
  HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login no ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Build image
        run: |
          docker build -f backend/Dockerfile -t "${{ secrets.AZURE_ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" backend/
          docker tag "${{ secrets.AZURE_ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" "${{ secrets.AZURE_ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest"

      - name: Push image
        run: |
          docker push "${{ secrets.AZURE_ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker push "${{ secrets.AZURE_ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest"

      - name: Healthcheck da aplicacao publicada
        if: ${{ env.HEALTHCHECK_URL != '' }}
        run: |
          echo "Validando ${HEALTHCHECK_URL}"
          for attempt in {1..30}; do
            status=$(curl -s -o /tmp/healthcheck-response.txt -w "%{http_code}" "${HEALTHCHECK_URL}" || true)
            if [ "$status" = "200" ]; then
              cat /tmp/healthcheck-response.txt
              exit 0
            fi
            echo "Tentativa ${attempt}/30 retornou HTTP ${status:-000}. Aguardando..."
            sleep 10
          done
          echo "Healthcheck falhou para ${HEALTHCHECK_URL}"
          cat /tmp/healthcheck-response.txt || true
          exit 1

spring:
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  security:
    jwt-secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    jwt-expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
    bootstrap-admin:
      username: ${APP_ADMIN_USERNAME:admin}
      password: ${APP_ADMIN_PASSWORD:admin123}
      nome-usuario: ${APP_ADMIN_NOME:Administrador}
      cpf: ${APP_ADMIN_CPF:00000000000}
      email: ${APP_ADMIN_EMAIL:admin@scoutpro.local}
      telefone: ${APP_ADMIN_TELEFONE:}

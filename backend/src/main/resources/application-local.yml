spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:scoutpro-project}?sslmode=${DB_SSLMODE:disable}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:scoutpro}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:scoutpro}}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    schemas: public
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_schema: public

app:
  security:
    jwt-secret: ${JWT_SECRET:local-scoutpro-jwt-secret-2026-local-only}
    jwt-expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

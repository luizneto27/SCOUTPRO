spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scoutpro-project}
    username: ${SPRING_DATASOURCE_USERNAME:scoutpro}
    password: ${SPRING_DATASOURCE_PASSWORD:scoutpro}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    schemas: public
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_schema: public

app:
  security:
    jwt-secret: ${JWT_SECRET:local-scoutpro-jwt-secret-2026-local-only}
    jwt-expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
